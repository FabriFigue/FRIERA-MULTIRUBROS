<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Matafuegos SP · Panel de gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase JS Client via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#E7E2D3;
    --panel:#FBF9F3;
    --panel-soft:#F1ECDD;
    --ink:#211D18;
    --ink-soft:#6E6A5D;
    --border:#D6CDB6;
    --red:#C1272D;
    --red-soft:#F5E0DE;
    --amber:#DE9A33;
    --amber-soft:#FBF0DA;
    --green:#3F7D52;
    --green-soft:#E6F0E7;
    --hazard:#F2B705;
    --steel:#8B8D89;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .display{font-family:'Oswald',sans-serif;}

  /* Sidebar */
  .sidebar{
    width:224px;
    flex-shrink:0;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px),
      var(--ink);
    color:#EFEDE8;
    display:flex;
    flex-direction:column;
    padding:24px 16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 8px 24px 8px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:20px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:6px;
    background:var(--red);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transform:rotate(45deg);
    box-shadow:0 0 0 2px rgba(255,255,255,0.15);
  }
  .brand-mark svg{width:15px;height:15px;transform:rotate(-45deg);}
  .brand-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:15.5px;line-height:1.2;letter-spacing:.2px;}
  .brand-sub{font-size:11px;color:rgba(239,237,232,0.5);margin-top:1px;}

  nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:7px;
    font-size:13.5px;font-weight:500;
    color:rgba(239,237,232,0.72);
    cursor:pointer;border:none;background:none;
    text-align:left;width:100%;
    transition:background .15s, color .15s, transform .1s ease;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;transition:transform .2s ease;}
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#EFEDE8;}
  .nav-item:active{transform:scale(0.97);}
  .nav-item.active{background:var(--red);color:#fff;}
  .nav-item.active svg{opacity:1;}
  .nav-item.bounce svg{animation:nav-bounce .32s ease;}
  @keyframes nav-bounce{
    0%{transform:scale(1);}
    40%{transform:scale(1.28);}
    100%{transform:scale(1);}
  }
  .nav-led{width:6px;height:6px;border-radius:50%;margin-left:auto;flex-shrink:0;background:rgba(239,237,232,0.15);}
  .nav-item.active .nav-led{
    background:#7CFF9E;box-shadow:0 0 6px 1px rgba(124,255,158,0.7);
    animation:led-blink 1.6s ease-in-out infinite;
  }
  @keyframes led-blink{0%,100%{opacity:1;} 50%{opacity:.4;}}

  .sidebar-foot{
    margin-top:auto;padding:12px 8px 0 8px;
    border-top:1px solid rgba(255,255,255,0.12);
    font-size:11px;color:rgba(239,237,232,0.4);
    display:flex;flex-direction:column;gap:4px;
  }
  .sync-indicator{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;
  }
  .sync-dot{
    width:7px;height:7px;border-radius:50%;background:#F2B705;
  }
  .sync-dot.online{background:#7CFF9E;box-shadow:0 0 6px rgba(124,255,158,0.8);}
  .sync-dot.offline{background:#8B8D89;}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .hazard-strip{
    height:6px;flex-shrink:0;
    background:repeating-linear-gradient(135deg, var(--hazard) 0 14px, #1B1B19 14px 28px);
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  .topbar h1{font-family:'Oswald',sans-serif;font-size:21px;font-weight:600;letter-spacing:.2px;}
  .topbar .date{font-size:12.5px;color:var(--ink-soft);margin-top:2px;text-transform:capitalize;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .btn{
    position:relative;overflow:visible;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--red);color:#fff;
    padding:10px 18px;border-radius:24px;
    border:2px solid #E2A923;
    font-size:13.5px;font-weight:600;font-family:'Inter',sans-serif;
    cursor:pointer;
    box-shadow:0 3px 0 #841616, 0 5px 10px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:transform .08s ease, box-shadow .08s ease, background .15s;
  }
  .btn::before{
    content:'';position:absolute;inset:-5px;border-radius:28px;
    border:2px dashed rgba(226,169,35,0.55);
    animation:btn-pulse 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  .btn:hover{background:#a82323;}
  .btn:active{
    transform:translateY(3px);
    box-shadow:0 0 0 #841616, inset 0 2px 5px rgba(0,0,0,0.3);
  }
  @keyframes btn-pulse{
    0%,100%{opacity:.3;transform:scale(1);}
    50%{opacity:.85;transform:scale(1.05);}
  }
  .btn-ripple{
    position:absolute;border-radius:50%;background:rgba(255,255,255,0.55);
    transform:scale(0);pointer-events:none;
    animation:btn-ripple-anim .55s ease-out forwards;
  }
  @keyframes btn-ripple-anim{ to{transform:scale(3.2);opacity:0;} }
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border);box-shadow:none;}
  .btn.ghost::before{display:none;}
  .btn.ghost:hover{background:var(--panel-soft);}
  .btn.ghost:active{transform:translateY(1px);}

  .content{padding:28px 32px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;}
  .view{display:none;}
  .view.active{display:block;}

  /* Top Panels */
  .top-panels{display:grid;grid-template-columns:236px 1fr;gap:14px;margin-bottom:28px;}
  .gauge-card{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:16px 16px 14px 16px;display:flex;flex-direction:column;align-items:center;
    border-top:3px solid var(--ink);
  }
  .gauge-card svg{width:100%;height:auto;max-width:190px;}
  .gauge-pct{font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;line-height:1;margin-top:2px;}
  .gauge-label{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:3px;line-height:1.35;}
  .gauge-state{font-size:11.5px;font-weight:700;margin-top:8px;padding:3px 10px;border-radius:20px;}
  .gauge-state.good{background:var(--green-soft);color:var(--green);}
  .gauge-state.mid{background:var(--amber-soft);color:#a76e1e;}
  .gauge-state.bad{background:var(--red-soft);color:var(--red);}

  .stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .stat{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:15px 17px;border-top:3px solid var(--border);
  }
  .stat.warn{border-top-color:var(--red);}
  .stat .num{font-family:'Oswald',sans-serif;font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;}
  .stat .label{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat.warn .num{color:var(--red);}

  .section-title{
    font-family:'Oswald',sans-serif;font-size:15.5px;font-weight:600;letter-spacing:.2px;
    margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;
  }
  .section-title span.count{
    font-family:'Inter',sans-serif;font-weight:500;font-size:12px;color:var(--ink-soft);
  }

  /* Vencimientos */
  .venc-list{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:28px;}
  .venc-row{
    display:flex;align-items:center;gap:14px;
    padding:13px 18px 13px 46px;
    border-left:4px solid var(--border);
    border-bottom:1px solid var(--border);
    position:relative;
  }
  .venc-row:last-child{border-bottom:none;}
  .venc-row::before{
    content:'';position:absolute;left:18px;top:50%;transform:translateY(-50%);
    width:11px;height:11px;border-radius:50%;
    background:var(--bg);border:2px solid var(--border);
  }
  .venc-row::after{
    content:'';position:absolute;left:34px;top:9px;bottom:9px;
    border-left:1.5px dashed var(--border);
  }
  .venc-row.vencido{border-left-color:var(--red);}
  .venc-row.proximo{border-left-color:var(--amber);}
  .venc-row.ok{border-left-color:var(--green);}
  .venc-row .cliente{font-weight:600;font-size:13.5px;flex:1;min-width:0;}
  .venc-row .detalle{font-size:12px;color:var(--ink-soft);flex:1.4;}
  .venc-row .fecha{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;width:110px;text-align:right;}
  .venc-row.vencido .fecha{color:var(--red);}
  .venc-row.proximo .fecha{color:var(--amber);}
  .venc-row.ok .fecha{color:var(--green);}
  .pill{
    font-size:10.5px;font-weight:700;letter-spacing:.2px;
    padding:3px 8px;border-radius:20px;width:78px;text-align:center;flex-shrink:0;
  }
  .pill.vencido{background:var(--red-soft);color:var(--red);}
  .pill.proximo{background:var(--amber-soft);color:#a76e1e;}
  .pill.ok{background:var(--green-soft);color:var(--green);}

  /* Tablas */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  thead th{
    text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-soft);
    padding:11px 16px;border-bottom:1px solid var(--border);background:var(--panel-soft);
  }
  tbody td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel-soft);}
  td.num{font-variant-numeric:tabular-nums;text-align:right;}
  td.stock-low{color:var(--red);font-weight:600;}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
  input.search{
    flex:1;min-width:240px;max-width:320px;padding:9px 13px;border:1px solid var(--border);
    border-radius:7px;font-size:13px;font-family:'Inter',sans-serif;background:var(--panel);
  }
  input.search:focus{outline:none;border-color:var(--red);}

  .tag{
    display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px;
    background:var(--panel-soft);color:var(--ink-soft);
  }

  .empty-note{
    background:var(--amber-soft);border:1px solid #EED8AE;border-radius:10px;
    padding:14px 18px;font-size:12.5px;color:#8a5c1a;margin-bottom:20px;line-height:1.5;
  }
  .empty-note b{color:#6b4110;}

  /* Feed / Novedades */
  .feed-panel{
    background:var(--ink);border-radius:14px;padding:22px 22px 8px 22px;margin-bottom:28px;
    position:relative;overflow:hidden;
  }
  .feed-panel::before{
    content:'';position:absolute;top:-40%;right:-8%;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle, rgba(194,42,42,0.28) 0%, rgba(194,42,42,0) 70%);
    pointer-events:none;
  }
  .feed-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;position:relative;}
  .feed-head h2{font-family:'Oswald',sans-serif;color:#EFEDE8;font-size:17.5px;font-weight:600;letter-spacing:.2px;}
  .feed-head .feed-date{color:rgba(239,237,232,0.5);font-size:12px;text-transform:capitalize;}
  .feed-sub{color:rgba(239,237,232,0.55);font-size:12.5px;margin-bottom:16px;position:relative;}

  .feed-item{
    display:flex;gap:13px;align-items:flex-start;
    padding:13px 0;border-top:1px solid rgba(239,237,232,0.1);
    position:relative;
  }
  .feed-icon{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }
  .feed-icon svg{width:16px;height:16px;}
  .feed-icon.vencido{background:rgba(194,42,42,0.22);}
  .feed-icon.vencido svg{stroke:#F19999;}
  .feed-icon.urgente{background:rgba(222,154,52,0.22);}
  .feed-icon.urgente svg{stroke:#F2C77E;}
  .feed-icon.stock{background:rgba(222,154,52,0.22);}
  .feed-icon.stock svg{stroke:#F2C77E;}
  .feed-icon.venta{background:rgba(61,122,92,0.25);}
  .feed-icon.venta svg{stroke:#8FCBAA;}

  .feed-body{flex:1;min-width:0;}
  .feed-title{color:#F5F3EF;font-size:13.5px;font-weight:600;line-height:1.35;}
  .feed-detail{color:rgba(239,237,232,0.5);font-size:12px;margin-top:2px;line-height:1.4;}
  .feed-when{font-size:11px;font-weight:600;flex-shrink:0;white-space:nowrap;margin-top:2px;}
  .feed-when.vencido{color:#F19999;}
  .feed-when.urgente{color:#F2C77E;}
  .feed-when.stock{color:#F2C77E;}
  .feed-when.venta{color:rgba(239,237,232,0.4);}

  .feed-empty{
    display:flex;align-items:center;gap:10px;padding:18px 0 22px 0;color:rgba(239,237,232,0.55);
    font-size:13px;position:relative;
  }
  .feed-empty svg{width:18px;height:18px;stroke:#8FCBAA;flex-shrink:0;}

  .feed-carousel{display:flex;align-items:center;gap:10px;position:relative;}
  .feed-nav-btn{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    border:1px solid rgba(239,237,232,0.18);background:rgba(239,237,232,0.06);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s, border-color .15s, transform .12s ease;
  }
  .feed-nav-btn:hover{background:rgba(239,237,232,0.16);border-color:rgba(242,183,5,0.5);}
  .feed-nav-btn:active{transform:scale(0.88) rotate(-14deg);}
  .feed-nav-btn svg{width:14px;height:14px;stroke:#EFEDE8;}
  .feed-current{flex:1;min-width:0;}
  .feed-current .feed-item{padding:4px 0;border-top:none;}
  .feed-current .feed-title{font-size:14.5px;}
  .feed-current .feed-detail{font-size:12.5px;}

  .feed-progress{display:flex;gap:5px;justify-content:center;margin-top:16px;position:relative;}
  .feed-dot{width:5px;height:5px;border-radius:3px;background:rgba(239,237,232,0.2);transition:background .2s,width .2s;}
  .feed-dot.active{background:var(--red);width:16px;}

  .feed-toggle{
    display:block;width:100%;text-align:center;margin-top:16px;padding-top:12px;
    background:none;border:none;border-top:1px solid rgba(239,237,232,0.1);
    color:rgba(239,237,232,0.5);font-size:12px;font-family:'Inter',sans-serif;
    cursor:pointer;position:relative;
  }
  .feed-toggle:hover{color:#EFEDE8;}

  /* --- SECCION: SEMILLERO DE IDEAS --- */
  .seed-header-box{
    background:var(--panel);border:1px solid var(--border);border-left:5px solid var(--hazard);
    border-radius:10px;padding:16px 20px;margin-bottom:22px;display:flex;
    justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  }
  .seed-header-title{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;}
  .seed-header-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .seed-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));gap:16px;}
  .seed-card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;position:relative;display:flex;flex-direction:column;
    box-shadow:0 3px 8px rgba(0,0,0,0.03);transition:transform .12s, box-shadow .12s;
  }
  .seed-card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,0.06);}
  .seed-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .seed-badge{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
    padding:2px 8px;border-radius:12px;
  }
  .seed-badge.rubro{background:#FCECD0;color:#965908;}
  .seed-badge.funcionalidad{background:#E1EDF7;color:#185387;}
  .seed-badge.urgente{background:var(--red-soft);color:var(--red);}
  .seed-badge.general{background:var(--panel-soft);color:var(--ink-soft);}
  .seed-title{font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;line-height:1.3;margin-bottom:6px;}
  .seed-text{font-size:12.5px;color:var(--ink);line-height:1.45;flex:1;white-space:pre-wrap;}
  .seed-meta{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:10px;border-top:1px dashed var(--border);font-size:11px;color:var(--ink-soft);}
  .seed-status{cursor:pointer;font-weight:600;padding:2px 7px;border-radius:4px;border:1px solid transparent;}
  .seed-status.pendiente{color:#B86F00;background:var(--amber-soft);border-color:#F2C77E;}
  .seed-status.en-proceso{color:#185387;background:#E1EDF7;border-color:#A8CCE8;}
  .seed-status.listo{color:var(--green);background:var(--green-soft);border-color:#B1D8BA;}

  /* Modales y Formularios */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(33,29,24,0.55);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel);border-radius:14px;width:100%;max-width:440px;
    max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.3);
    border-top:4px solid var(--red);
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px 14px 20px;border-bottom:1px solid var(--border);
  }
  .modal-head h3{font-family:'Oswald',sans-serif;font-size:16.5px;font-weight:600;letter-spacing:.2px;}
  .modal-close{background:none;border:none;font-size:20px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:4px;}
  .modal-close:hover{color:var(--ink);}
  #modal-form, #config-form{padding:18px 20px 20px 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:7px;
    font-size:13.5px;font-family:'Inter',sans-serif;background:var(--panel);color:var(--ink);
  }
  .field textarea{min-height:90px;resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(194,42,42,0.12);
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;}

  /* Acciones en filas */
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .icon-btn{
    width:28px;height:28px;border-radius:6px;flex-shrink:0;
    border:1px solid var(--border);background:var(--panel);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s, transform .08s;
  }
  .icon-btn:hover{background:var(--panel-soft);}
  .icon-btn:active{transform:scale(0.88);}
  .icon-btn svg{width:14px;height:14px;stroke:var(--ink-soft);}
  .icon-btn.danger:hover{background:var(--red-soft);}
  .icon-btn.danger:hover svg{stroke:var(--red);}

  .dot-ico{width:9px;height:9px;display:inline-block;vertical-align:-1px;color:var(--red);opacity:.6;margin:0 1px;}
  .feed-detail .dot-ico, .feed-title .dot-ico{opacity:.55;}

  /* FAB Menu */
  .fab-dock{position:relative;margin-bottom:18px;}
  .fab-btn-dock{
    position:relative;width:100%;display:flex;align-items:center;gap:12px;
    background:rgba(194,42,42,0.16);border:1.5px solid rgba(226,169,35,0.55);
